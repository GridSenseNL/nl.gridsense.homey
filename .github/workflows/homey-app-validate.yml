name: Validate Homey App
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  main:
    name: Validate Homey App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Homey CLI compiles this app with `npx tsc`, which needs both
      # `typescript` and the `@tsconfig/node16` base config that tsconfig.json
      # extends. Both are devDependencies, so without an install step the
      # compile fails with "unable to read configuration from
      # `npx tsc --showConfig`". The validate action does not install
      # dependencies itself.
      #
      # This uses `npm ci --ignore-scripts` to match exactly what the publish
      # action does internally, so validate exercises the same install path
      # that publishing will use.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - uses: athombv/github-action-homey-app-validate@master
        with:
          level: verified
